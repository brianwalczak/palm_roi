[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palm_roi"
version = "0.1.2"
description = "A lightweight palm region-of-interest (ROI) extraction tool using hand landmarks and OpenCV."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.8"
authors = [
    { name = "Brian Walczak", email = "me@brian.re" },
]
keywords = ["palm", "roi", "hand", "biometric", "computer vision", "opencv", "palm vein", "palm print", "palmar"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opencv-python",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/palm_roi"]

[project.urls]
Homepage = "https://github.com/brianwalczak/palm_roi"
Repository = "https://github.com/brianwalczak/palm_roi"
